name: Windows installer

on:
  push:
    branches: [feature/bulk-media-download]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust 1.95.0
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Lint frontend
        shell: pwsh
        run: |
          bun run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Typecheck frontend
        shell: pwsh
        run: |
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test frontend
        shell: pwsh
        run: |
          bun test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rebuild injected assets
        shell: pwsh
        run: |
          bun run build:inject
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check generated assets are in sync
        shell: pwsh
        run: |
          git diff --exit-code -- src-tauri/inject
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Rust formatting
        shell: pwsh
        run: |
          cargo +1.95.0 fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Rust clippy
        shell: pwsh
        run: |
          cargo +1.95.0 clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Rust library tests
        shell: pwsh
        run: |
          cargo +1.95.0 test --manifest-path src-tauri/Cargo.toml --locked --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS installer
        shell: pwsh
        env:
          CARRIER_BUILD_REVISION: ${{ github.sha }}
        run: |
          bun run tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage installer and portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-msvc'
          $installerSource = Get-ChildItem "src-tauri/target/$target/release/bundle/nsis" -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installerSource) { throw 'No NSIS installer was produced.' }

          $output = 'windows-artifacts'
          New-Item -ItemType Directory -Path $output | Out-Null
          $installer = Join-Path $output 'Carrier-Media-Windows-x64-setup.exe'
          Copy-Item $installerSource.FullName $installer

          $releaseDir = "src-tauri/target/$target/release"
          $appExe = Get-ChildItem $releaseDir -Filter '*.exe' -File | Select-Object -First 1
          if (-not $appExe) { throw 'No application executable was produced for the portable archive.' }
          $staging = Join-Path $output 'portable-staging'
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item $appExe.FullName (Join-Path $staging 'Carrier.exe')
          Copy-Item 'LICENSE' (Join-Path $staging 'LICENSE')
          @'
          Carrier Media for Windows

          Extract this folder and run Carrier.exe. This portable version requires Microsoft Edge WebView2 Runtime; use the setup installer if the runtime is missing.
          Sign in to Facebook Messenger inside Carrier. This portable build keeps its settings and sign-in data in your Windows user profile.
          '@ | Set-Content -Path (Join-Path $staging 'README.txt') -Encoding utf8
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath (Join-Path $output 'Carrier-Media-Windows-x64-portable.zip')

          $hashLines = @()
          foreach ($file in Get-ChildItem $output -File) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashLines += "$hash  $($file.Name)"
          }
          $hashLines | Set-Content -Path (Join-Path $output 'SHA256SUMS.txt') -Encoding ascii
          Remove-Item $staging -Recurse -Force

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Carrier-Media-Windows-x64
          path: windows-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Add download instructions to run summary
        shell: pwsh
        run: |
          @'
          ## Download the Windows build

          Open this workflow run and download **Carrier-Media-Windows-x64** from its Artifacts section. Unzip the artifact, then run `Carrier-Media-Windows-x64-setup.exe` to install. The portable option is `Carrier-Media-Windows-x64-portable.zip`. `SHA256SUMS.txt` contains checksums for both files.
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
